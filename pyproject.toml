[project]
name = "hsrsim"
version = "0.1.0"
description = "Honkai: Star Rail combat simulator for measuring character damage output"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "isort", "mypy"]

[project.scripts]
hsrsim = "hsrsim.cli:main"

[tool.setuptools.packages.find]
include = ["hsrsim*"]

[tool.setuptools.package-data]
hsrsim = ["data/gamedata/*.json"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM108", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# listeners are often written as `lambda ev: cond and action()`
disable_error_code = ["func-returns-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
