# Several teams x several scenarios. Output: DMG (millions) or cycles to clear.
runs: 3
scenarios:
  - {preset: boss, cycles: 5, weaknesses: all}            # single target, 5 cycles
  - {preset: aoe, count: 3, cycles: 5, weaknesses: all}   # 3 targets, 5 cycles
  - {preset: moc, half: 1}                               # latest Memory of Chaos 12, first half (clear speed)
teams:
  Acheron / Pela / SW / Huohuo:
    - {character: Acheron, light_cone: Along the Passing Shore, main_stats: {body: crit_rate, feet: atk%, sphere: elemental, rope: atk%}, substats: {crit_rate: 6r, crit_dmg: 12r, atk%: 3r}}
    - {character: Pela, main_stats: {body: ehr, feet: spd, sphere: hp%, rope: err}, substats: {spd: 10r, ehr: 5r}}
    - {character: Silver Wolf, main_stats: {body: ehr, feet: spd, sphere: hp%, rope: err}, substats: {spd: 10r, ehr: 5r}}
