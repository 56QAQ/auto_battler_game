  Kafka+ / Black Swan+ / Sparkle+ / Huohuo+:
    - {character: Kafka, enhanced: true, light_cone: Patience Is All You Need, main_stats: {body: ehr, feet: spd, sphere: elemental, rope: atk%}, substats: {atk%: 8r, spd: 6r, ehr: 4r}}
